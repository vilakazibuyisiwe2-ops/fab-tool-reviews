title: "Fab & Tool Reviews"
description: "Independent welding, fabrication tool, and workshop gear reviews from a qualified boilermaker."
url: "https://fabandtoolreviews.com"
baseurl: ""
locale: "en_ZA"

author:
  name: "Buyisiwe Vilakazi"
  url: "https://fabandtoolreviews.com/about/"

social:
  name: "Fab & Tool Reviews"
  links:
    - "https://www.linkedin.com/in/buyisiwe-vilakazi"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

logo: "/assets/images/fab-tool-reviews-mark.svg"

permalink: /:title/

header_pages:
  - reviews.md
  - education.md
  - about.markdown
  - contact.markdown
  - affiliate-disclosure.md

collections:
  reviews:
    output: true
    permalink: /reviews/:name/
  educational:
    output: true
    permalink: /educational/:name/

defaults:
  - scope:
      path: ""
    values:
      image: "/assets/images/fab-tool-reviews-mark.svg"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "reviews"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "educational"
    values:
      layout: "post"
