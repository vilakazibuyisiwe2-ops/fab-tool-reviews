title: "Fab & Tool Reviews"
description: "Honest reviews of welding equipment, fabrication tools, and engineering software."
baseurl: "/fab-tool-reviews"
url: "https://vilakazibuyisiwe2-ops.github.io"
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

permalink: /:title/

# SEO / social defaults
author: "Buyisiwe Vilakazi"
social:
  name: "Fab & Tool Reviews"

# Use in links as {{ site.amazon_tag }}
amazon_tag: "smartfabricat-20"

# Show these pages in the Minima navigation.
header_pages:
  - posts.md
  - reviews.md
  - about.markdown
  - contact.markdown

collections:
  reviews:
    output: true
    permalink: /reviews/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "reviews"
    values:
      layout: "page"
