 title: "Fab & Tool Reviews"
 description: "Independent welding, fabrication tool, and workshop gear reviews from a qualified boilermaker."
 baseurl: "/fab-tool-reviews"
 url: "https://vilakazibuyisiwe2-ops.github.io"
 theme: minima
 plugins:
   - jekyll-feed
   - jekyll-sitemap
   - jekyll-seo-tag

 permalink: /:title/

 author: "Buyisiwe Vilakazi"
 social:
   name: "Fab & Tool Reviews"

 # Replace this with your custom domain when it is connected.
 amazon_tag: "smartfabricat-20"
 logo: "/assets/images/fab-tool-reviews-mark.svg"

 # Main site navigation.
 header_pages:
   - posts.md
   - reviews.md
   - education.md
   - about.markdown
   - contact.markdown
   - affiliate-disclosure.md

 collections:
   reviews:
     output: true
     permalink: /reviews/:name/

 defaults:
   - scope:
       path: ""
       type: "posts"
     values:
       layout: "post"
   - scope:
       path: ""
       type: "reviews"
     values:
       layout: "page"
